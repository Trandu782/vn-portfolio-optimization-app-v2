[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnopt-data"
version = "0.1.0"
description = "Data providers, repositories and sync jobs for the VN Portfolio Optimizer."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Postgres is only needed in production; SQLite uses the standard library.
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools]
packages = [
    "data",
    "data.providers",
    "data.v2",
    "data.v2.analytics",
    "data.v2.providers",
    "data.db",
    "data.jobs",
]

