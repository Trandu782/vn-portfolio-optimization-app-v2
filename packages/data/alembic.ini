# Alembic configuration for the data package.
# The database URL is overridden in alembic/env.py from DATABASE_URL / VNOPT_DATABASE_URL.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./vnopt.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
