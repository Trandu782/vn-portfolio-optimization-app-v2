name: Probe V2 providers

# Manually triggered. The project is local-only and not on GitHub yet, so this
# file is a forward-looking artifact: it runs scripts/probe_v2.py and
# scripts/probe_v2_candidates.py on a GitHub runner and uploads
# docs/PROVIDER_PROBE.md and docs/V2_CANDIDATES_PROBE.md. It does no git
# commit/push. Run it before promoting any SSI endpoint on a cloud IP.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to probe"
        required: false
        default: "VCB,FPT,HPG"
      years:
        description: "Years of history to request"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/core -e packages/data

      - name: Run provider probe
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          INPUT_TICKERS: ${{ inputs.tickers }}
          INPUT_YEARS: ${{ inputs.years }}
        run: |
          if ! [[ "${INPUT_TICKERS}" =~ ^[A-Za-z0-9]+(,[A-Za-z0-9]+)*$ ]]; then
            echo "Invalid tickers input: must be alphanumeric/comma-separated" >&2
            exit 1
          fi
          if ! [[ "${INPUT_YEARS}" =~ ^[0-9]+$ ]] || [ "${INPUT_YEARS}" -lt 1 ] || [ "${INPUT_YEARS}" -gt 20 ]; then
            echo "Invalid years input: must be an integer in 1..20" >&2
            exit 1
          fi
          python scripts/probe_v2.py \
            --environment ci \
            --tickers "${INPUT_TICKERS}" \
            --years "${INPUT_YEARS}"

      - name: Run candidate probe
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python scripts/probe_v2_candidates.py | tee docs/V2_CANDIDATES_PROBE.md

      - name: Upload provider probe report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-probe-report
          path: |
            docs/PROVIDER_PROBE.md
            docs/V2_CANDIDATES_PROBE.md
          if-no-files-found: error
