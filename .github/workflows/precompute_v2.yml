name: Precompute V2 datasets

# Runs the resumable V2 precompute pipeline on a runner (not a serverless
# function) after the Vietnamese market closes on trading days. The project is
# local-only today; when it is pushed to GitHub:
#
#   1. run the "Probe V2 providers" workflow first to confirm cloud-IP access to
#      SSI (Cloudflare fronts it) before trusting a scheduled backfill;
#   2. set a repository secret DATABASE_URL pointing at a persistent Postgres (a
#      runner's local SQLite file is discarded after the job), e.g. Supabase;
#   3. enable this workflow. Heavy backfills are chunked: dispatch it with
#      mode=full, limit=150 and unpriced=true repeatedly; each run resumes where
#      the previous one stopped because every ticker commits independently, and
#      unpriced=true spends every slot on a ticker that still has no bars instead
#      of re-fetching the ones that are already stored.
#
# A single weekday end-of-day schedule runs the job once per trading day to save
# GitHub Actions minutes and Supabase egress:
#
#   - `47 12 * * 1-5` -> 12:47 UTC = 19:47 ICT, Mon–Fri. Deliberately near the
#     end of the 19:00–20:00 ICT window and off :00/:30 (where GitHub's
#     scheduler queue is busiest), and late enough after the 15:00 ICT close
#     for `ssi_statistics` EOD bars to be published (on 2026-11-25 SSI still had
#     no bar for that session at 18:40 ICT while VCI and KBS already did).
#   - No overnight repair pass: because scheduled runs use `incremental` mode
#     with most-stale-first ordering and `LIMIT=1000`, any failed or
#     late-published session is picked up automatically by the next weekday's
#     19:47 ICT run or immediately via manual `workflow_dispatch`.
#
# GitHub evaluates `schedule` crons in UTC and may delay them; the
# "Report trigger" step prints the event, the cron expression that fired and
# both clocks, so a run that lands outside the expected window can be identified
# from the job log instead of guessed at. The job itself targets the last
# *completed* session, so a late or pre-close run still processes settled data.
on:
  # Temporarily disabled to stay within Supabase egress budget until 21 Dec reset:
  # schedule:
  #   # Weekdays 12:47 UTC = 19:47 ICT (single EOD run to save Actions minutes & Supabase egress).
  #   - cron: "47 12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (only new dates) or full (re-fetch window)"
        type: choice
        options:
          - incremental
          - full
        default: incremental
      start:
        description: "Backfill start date YYYY-MM-DD (blank uses the setting)"
        required: false
        default: ""
      limit:
        description: "Max tickers this run (blank = no cap, usually a timeout)"
        required: false
        default: "150"
      unpriced:
        description: "Only price tickers with no stored bars (finish a backfill)"
        type: boolean
        default: false
      profiles:
        description: "Force a market-cap / corporate-action refresh"
        type: boolean
        default: false
      as_of:
        description: "Dataset as-of date YYYY-MM-DD (blank = auto, see below)"
        required: false
        default: ""

permissions:
  contents: read

# One run at a time, ever. With `cancel-in-progress: false` a second trigger
# (a manual dispatch during a scheduled run, or a delayed scheduled run
# overlapping an active manual backfill) queues behind the active job instead
# of cancelling it or writing the same tickers concurrently. GitHub keeps at
# most one pending run per group and drops newer pending ones, which is safe
# here: scheduled runs are `incremental`, so the surviving run resumes from the
# committed progress of the one before it.
concurrency:
  group: precompute-v2
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODE: ${{ github.event_name == 'schedule' && 'incremental' || inputs.mode }}
      START: ${{ inputs.start }}
      # Blank = automatic: the pipeline targets the last *completed* Vietnam
      # session (today only after the 15:00 ICT close), and when the upstream
      # VNINDEX bars for it have not been published yet (an unknown holiday or a
      # provider that publishes late) falls back to the last published session with
      # a warning instead of failing the quality gate. An explicit value keeps the
      # strict stale-benchmark / stale-dataset errors.
      AS_OF: ${{ inputs.as_of }}
      # A scheduled run must bring the whole tracked universe to the latest session,
      # not just a 150-name slice: with a cap that small, a ticker late in the order
      # (or one that slipped behind) could sit at an older session for days while the
      # cap was spent on the same alphabetical head. The incremental refresh is cheap
      # (~1 page per ticker), so the cap is raised to 1000 and the pipeline orders the
      # pending tickers most-stale-first, which fixes a lagging tail on the next run
      # even if the job does hit its timeout. Every ticker commits independently, so a
      # later run resumes from the committed progress. A manual dispatch defaults to
      # the same 1000 and accepts a custom value; blank means no cap (a full backfill,
      # which normally exceeds the job timeout).
      LIMIT: ${{ github.event_name == 'schedule' && '1000' || inputs.limit }}
      UNPRICED: ${{ inputs.unpriced }}
      PROFILES: ${{ inputs.profiles }}
      # Optional tuning knobs, read from Settings -> Secrets and variables ->
      # Actions -> Variables. An unset variable falls back to the default below,
      # which mirrors packages/data/data/v2/config.py, so none is required.
      # The VNOPT_V2_*_ORDER and VNOPT_V2_*_RATE_LIMIT_PER_MINUTE variables do
      # not affect this job: the pipeline builds its adapters explicitly in
      # data/v2/precompute.py (sources_from_context) and throttles through the
      # shared client, so those two families only configure the API's runner.
      VNOPT_V2_BACKFILL_START_DATE: ${{ vars.VNOPT_V2_BACKFILL_START_DATE || '2023-01-01' }}
      VNOPT_V2_CLIENT_REQUESTS_PER_SECOND: ${{ vars.VNOPT_V2_CLIENT_REQUESTS_PER_SECOND || '3.0' }}
      VNOPT_V2_PRECOMPUTE_CONCURRENCY: ${{ vars.VNOPT_V2_PRECOMPUTE_CONCURRENCY || '3' }}
      VNOPT_V2_PRECOMPUTE_PRE_SCREEN_ENABLED: ${{ vars.VNOPT_V2_PRECOMPUTE_PRE_SCREEN_ENABLED || 'true' }}
      VNOPT_V2_PRECOMPUTE_PRE_SCREEN_MIN_MEDIAN_VOLUME: ${{ vars.VNOPT_V2_PRECOMPUTE_PRE_SCREEN_MIN_MEDIAN_VOLUME || '10000' }}
      VNOPT_V2_PRECOMPUTE_PRE_SCREEN_COOLDOWN_DAYS: ${{ vars.VNOPT_V2_PRECOMPUTE_PRE_SCREEN_COOLDOWN_DAYS || '30' }}
      VNOPT_V2_PRECOMPUTE_REBASE_OVERLAP_SESSIONS: ${{ vars.VNOPT_V2_PRECOMPUTE_REBASE_OVERLAP_SESSIONS || '10' }}
      VNOPT_V2_PRECOMPUTE_RATIOS_REFRESH_DAYS: ${{ vars.VNOPT_V2_PRECOMPUTE_RATIOS_REFRESH_DAYS || '7' }}
      # 0 = strict: any session the benchmark or the price dataset lags the last
      # completed session is an error. Set the variable to 1 only while an
      # upstream feed is known to publish a session late (an unknown exchange
      # holiday); the run then logs a warning instead of failing the gate.
      VNOPT_V2_PRECOMPUTE_STALENESS_TOLERANCE_SESSIONS: ${{ vars.VNOPT_V2_PRECOMPUTE_STALENESS_TOLERANCE_SESSIONS || '0' }}
      # Unbuffered stdout so every progress line reaches the Actions log as it is
      # written instead of being flushed on exit.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_REF: ${{ github.ref }}
        run: |
          # GitHub runs `schedule` crons in UTC and can deliver them late, and a
          # `concurrency` queue starts a run later than it was created. Print the
          # event, the cron expression that fired (empty for a dispatch), the ref
          # and both clocks, so a run outside the expected window is identifiable
          # from the log instead of inferred from the local time of the browser.
          echo "event        : ${EVENT_NAME}"
          echo "cron         : ${EVENT_SCHEDULE}"
          echo "ref          : ${EVENT_REF}"
          date -u '+UTC          : %Y-%m-%d %H:%M:%S'
          TZ=Asia/Ho_Chi_Minh date '+ICT (UTC+7)  : %Y-%m-%d %H:%M:%S'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          # Reuse the pip download cache between runs; the editable install of
          # both local packages re-resolves their third-party dependencies each
          # time, so key the cache on the pyproject files that declare them.
          cache: "pip"
          cache-dependency-path: |
            packages/core/pyproject.toml
            packages/data/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          # The [postgres] extra installs psycopg. Without it a Postgres
          # DATABASE_URL (Supabase) fails at connect with ModuleNotFoundError,
          # because psycopg is an optional dependency of vnopt-data only.
          python -m pip install -e "packages/core" -e "packages/data[postgres]"

      - name: Run V2 precompute
        shell: bash
        run: |
          set -o pipefail
          args=("--${MODE}")
          if [ -n "${START}" ]; then args+=(--start "${START}"); fi
          if [ -n "${LIMIT}" ]; then args+=(--limit "${LIMIT}"); fi
          if [ -n "${AS_OF}" ]; then args+=(--as-of "${AS_OF}"); fi
          if [ "${UNPRICED}" = "true" ]; then args+=(--unpriced); fi
          if [ "${PROFILES}" = "true" ]; then args+=(--profiles); fi
          python -u -m data.v2.jobs.precompute "${args[@]}" 2>&1 | tee precompute_report.txt

      - name: Verify stored rows
        if: always()
        run: |
          # Read-only table summary (counts, latest dates, unfinished progress).
          # The URL is masked first because the script prints the target database.
          echo "::add-mask::${DATABASE_URL}"
          python scripts/verify_v2_db.py 2>&1 | tee verify_report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: precompute-report
          path: |
            precompute_report.txt
            verify_report.txt
          if-no-files-found: warn
