name: Precompute V2 datasets

# Runs the resumable V2 precompute pipeline on a runner (not a serverless
# function) after the Vietnamese market closes on trading days. The project is
# local-only today; when it is pushed to GitHub:
#
#   1. run the "Probe V2 providers" workflow first to confirm cloud-IP access to
#      SSI (Cloudflare fronts it) before trusting a scheduled backfill;
#   2. set a repository secret DATABASE_URL pointing at a persistent Postgres (a
#      runner's local SQLite file is discarded after the job), e.g. Supabase;
#   3. enable this workflow. Heavy backfills are chunked: dispatch it with
#      mode=full and a limit (e.g. 150) repeatedly; each run resumes where the
#      previous one stopped because every ticker commits independently.
#
# `30 9 * * 1-5` is 09:30 UTC = 16:30 ICT, after the 15:00 ICT close.
on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (only new dates) or full (re-fetch window)"
        type: choice
        options:
          - incremental
          - full
        default: incremental
      start:
        description: "Backfill start date YYYY-MM-DD (blank uses the setting)"
        required: false
        default: ""
      limit:
        description: "Max tickers this run (blank = no cap); chunk a heavy backfill"
        required: false
        default: ""
      profiles:
        description: "Force a market-cap / corporate-action refresh"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: precompute-v2
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MODE: ${{ github.event_name == 'schedule' && 'incremental' || inputs.mode }}
      START: ${{ inputs.start }}
      LIMIT: ${{ inputs.limit }}
      PROFILES: ${{ inputs.profiles }}
      # Optional tuning knobs, read from Settings -> Secrets and variables ->
      # Actions -> Variables. An unset variable falls back to the default below,
      # which mirrors packages/data/data/v2/config.py, so none is required.
      # The VNOPT_V2_*_ORDER and VNOPT_V2_*_RATE_LIMIT_PER_MINUTE variables do
      # not affect this job: the pipeline builds its adapters explicitly in
      # data/v2/precompute.py (sources_from_context) and throttles through the
      # shared client, so those two families only configure the API's runner.
      VNOPT_V2_BACKFILL_START_DATE: ${{ vars.VNOPT_V2_BACKFILL_START_DATE || '2023-01-01' }}
      VNOPT_V2_CLIENT_REQUESTS_PER_SECOND: ${{ vars.VNOPT_V2_CLIENT_REQUESTS_PER_SECOND || '0.5' }}
      VNOPT_V2_PRECOMPUTE_PRE_SCREEN_ENABLED: ${{ vars.VNOPT_V2_PRECOMPUTE_PRE_SCREEN_ENABLED || 'true' }}
      VNOPT_V2_PRECOMPUTE_PRE_SCREEN_MIN_MEDIAN_VOLUME: ${{ vars.VNOPT_V2_PRECOMPUTE_PRE_SCREEN_MIN_MEDIAN_VOLUME || '10000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          # The [postgres] extra installs psycopg. Without it a Postgres
          # DATABASE_URL (Supabase) fails at connect with ModuleNotFoundError,
          # because psycopg is an optional dependency of vnopt-data only.
          python -m pip install -e "packages/core" -e "packages/data[postgres]"

      - name: Run V2 precompute
        shell: bash
        run: |
          set -o pipefail
          args=("--${MODE}")
          if [ -n "${START}" ]; then args+=(--start "${START}"); fi
          if [ -n "${LIMIT}" ]; then args+=(--limit "${LIMIT}"); fi
          if [ "${PROFILES}" = "true" ]; then args+=(--profiles); fi
          python -m data.v2.jobs.precompute "${args[@]}" 2>&1 | tee precompute_report.txt

      - name: Verify stored rows
        if: always()
        run: |
          # Read-only table summary (counts, latest dates, unfinished progress).
          # The URL is masked first because the script prints the target database.
          echo "::add-mask::${DATABASE_URL}"
          python scripts/verify_v2_db.py 2>&1 | tee verify_report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precompute-report
          path: |
            precompute_report.txt
            verify_report.txt
          if-no-files-found: warn
