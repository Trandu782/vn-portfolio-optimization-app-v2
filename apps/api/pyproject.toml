[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnopt-api"
version = "0.1.0"
description = "Thin FastAPI layer for the VN Portfolio Optimizer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    # pandas is test-only: the analytics tests cross-check beta/correlation against an
    # independent pandas computation on three sectors. It is not a runtime dependency.
    "pandas>=2.2",
    "pytest>=8.2",
    "ruff>=0.8",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.v1"]
